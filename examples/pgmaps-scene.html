<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PGMaps forest scene · Nanite library</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb8cf; }
      canvas { display: block; width: 100%; height: 100%; }
      #scene-controls { position: fixed; top: 10px; left: 10px; max-width: calc(100% - 20px); z-index: 1; }
      #info { padding: 8px 10px; white-space: pre-wrap; color: #e8eef2; background: rgb(3 13 15 / 70%); font: 12px/1.5 ui-monospace, Consolas, monospace; border-radius: 4px; pointer-events: none; }
      #file { margin-top: 6px; max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="scene-controls">
      <div id="info" role="status">Loading...</div>
      <input id="file" type="file" accept=".json,application/json" aria-label="PGMaps scene package" hidden />
    </div>
    <script type="module" src="./pgmaps-scene.ts"></script>
  </body>
</html>
